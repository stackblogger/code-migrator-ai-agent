[project]
name = "py-fastapi-shop"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.7",
    "pyjwt>=2.8",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
