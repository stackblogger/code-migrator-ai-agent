[project]
name = "code-migrator"
version = "0.1.0"
description = "AI agent that migrates a codebase from one language/framework to another and proves the behaviour is same."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
    "pydantic>=2.8",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.scripts]
migrator = "migrator.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon (slower). Skip with -m 'not docker'"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
